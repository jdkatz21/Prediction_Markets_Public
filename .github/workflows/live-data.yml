name: Live Data Update

# Daily incremental update for econfutures.com. Each morning it adds the previous
# day's trades (UTC) to the archive on S3 (code/live_pipeline/update_trades.py),
# reruns the distributions and moments (code/convert_trades_to_pdfs/data_convert_runner.R),
# keeps everything already posted exactly as it was (code/live_pipeline/freeze_outputs.py),
# and uploads the result back to S3.
on:
  schedule:
    - cron: "0 11 * * *"   # every day, 11:00 UTC (6am EST / 7am EDT)
  workflow_dispatch:       # allow manual triggering too

# Never run two updates at once; a second run waits for the first
concurrency:
  group: live-data
  cancel-in-progress: false

# Where the data lives. A test copy of this repo can set the repository variable
# DATA_BUCKET (e.g. s3://kalshi-and-the-rise-of-macro-markets/staging) to keep
# test runs away from the data the website reads.
env:
  BUCKET: ${{ vars.DATA_BUCKET || 's3://kalshi-and-the-rise-of-macro-markets' }}

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Get the trade archive
      # -----------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download trade archive and published data from S3
        run: |
          aws s3 sync $BUCKET/trade_level_data data/trade_level_data
          aws s3 sync $BUCKET/daily_distribution_data published/daily_distribution_data
          aws s3 sync $BUCKET/daily_moments_data published/daily_moments_data
          aws s3 cp $BUCKET/frozen_through.txt published/frozen_through.txt || echo "No frozen_through.txt yet (first run)"

      # -----------------------
      # Python: add new trades
      # -----------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pandas python-dotenv cryptography requests websockets

      - name: Add new trades
        env:
          KALSHI_KEYID: ${{ secrets.KALSHI_KEYID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python code/live_pipeline/update_trades.py

      # -----------------------
      # R: distributions and moments
      # -----------------------
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          install.packages(c("tidyverse", "lubridate", "matrixStats", "collapse", "DescTools"),
                          repos = c("https://packagemanager.posit.co/cran/__linux__/jammy/latest",
                                   "https://cloud.r-project.org"))
        shell: Rscript {0}

      - name: Create output directories
        run: |
          mkdir -p data/daily_distribution_data/wide
          mkdir -p data/daily_moments_data

      - name: Run R script to convert to PDFs and Moments Data
        run: Rscript code/convert_trades_to_pdfs/data_convert_runner.R

      - name: Keep already-posted data unchanged
        run: python code/live_pipeline/freeze_outputs.py published

      # -----------------------
      # Upload to AWS S3
      # -----------------------
      - name: Sync data to S3
        run: |
          aws s3 sync data/trade_level_data $BUCKET/trade_level_data
          aws s3 sync data/daily_distribution_data $BUCKET/daily_distribution_data
          aws s3 sync data/daily_moments_data $BUCKET/daily_moments_data
          aws s3 cp data/frozen_through.txt $BUCKET/
          echo "$(date -u '+%B %-d, %Y') (data through $(cat data/frozen_through.txt), UTC)" > data/last_updated.txt
          aws s3 cp data/last_updated.txt $BUCKET/
